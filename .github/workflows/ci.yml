name: CI

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (derleme + test + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Derle, birim testleri, lint
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
      - name: Release derlemesi (R8 doğrulaması, imzasız)
        run: ./gradlew --no-daemon assembleRelease -x uploadCrashlyticsMappingFileRelease
      - name: Debug APK (telefona kurmak için)
        uses: actions/upload-artifact@v4
        with:
          name: astronode-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Raporları yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

  firebase:
    name: Firebase kuralları, fonksiyonlar, admin paneli
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            firebase/package-lock.json
            firebase/functions/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: firebase/functions
      - name: Firestore kural testleri
        run: npm test
      - name: Cloud Functions testleri
        run: npm run test:functions
      - name: Göç script'i testi
        run: npm run test:tools
      - name: Admin paneli uçtan uca testi (Chromium)
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: E2E ekran görüntüleri
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-panel-screenshots
          path: firebase/test-e2e/out/
          retention-days: 7

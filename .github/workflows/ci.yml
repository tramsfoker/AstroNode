name: CI

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (derleme + test + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Derle, birim testleri, lint
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
      - name: Release derlemesi (R8 doğrulaması, imzasız)
        run: ./gradlew --no-daemon assembleRelease -x uploadCrashlyticsMappingFileRelease
      - name: Raporları yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

  firebase:
    name: Firebase kuralları + göç script'i
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - run: npm ci
      - name: Firestore kural testleri
        run: npm test
      - name: Göç script'i testi
        run: npm run test:tools
